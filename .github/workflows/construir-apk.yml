name: Construir APK

on:
  push:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - name: Crear la parte de Android
        run: |
          flutter create --platforms=android --org co.evento --project-name control_ingreso .
          rm -rf test

      - name: Permiso de camara, nombre de la app y version minima de Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' $M
          sed -i 's#android:label="control_ingreso"#android:label="Control Ingreso"#' $M
          if [ -f android/app/build.gradle.kts ]; then sed -i 's#minSdk = flutter.minSdkVersion#minSdk = maxOf(flutter.minSdkVersion, 23)#' android/app/build.gradle.kts; fi
          if [ -f android/app/build.gradle ]; then sed -i 's#minSdkVersion flutter.minSdkVersion#minSdkVersion 23#' android/app/build.gradle; fi

      - name: Descargar librerias
        run: flutter pub get

      - name: Construir el APK
        run: flutter build apk --release

      - name: Entregar el APK
        uses: actions/upload-artifact@v4
        with:
          name: control-ingreso-apk
          path: build/app/outputs/flutter-apk/app-release.apk
